name: Demo Web App - Build and Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
        continue-on-error: true   # lets Scenario C create a change with failed-test evidence
      - name: Send test results to ServiceNow
        if: always()
        uses: ServiceNow/servicenow-devops-test-report@main   # pin to the latest release tag before the demo
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          xml-report-filename: junit.xml

  change:
    name: Change approval
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ServiceNow change
        uses: ServiceNow/servicenow-devops-change@v4.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Change approval'
          change-request: '{"autoCloseChange":true,"attributes":{"short_description":"Demo Web App - automated deployment","assignment_group":"6fec7fdd5b40011074d09113a281c771","description":"GitHub Actions run ${{ github.run_number }}","implementation_plan":"Automated deployment by GitHub Actions","backout_plan":"Redeploy previous successful run","test_plan":"Automated unit tests"}}'
          interval: '30'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

  deploy:
    name: Deploy to production
    needs: change
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Deploying Demo Web App build ${{ github.run_number }}"
